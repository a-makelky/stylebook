name = "stylebook"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# A custom domain otherwise turns the workers.dev hostname off.
# https://developers.cloudflare.com/workers/configuration/routing/workers-dev/
workers_dev = true
preview_urls = true
# global_fetch_strictly_public: a fetch from this Worker to its own host is
# another Worker on the same zone. Without this flag that fetch returns 1042.
# With it, the fetch comes back in through the public front door, which is how
# the request handler reaches the Git route.
# https://developers.cloudflare.com/workers/configuration/compatibility-flags/#global-fetch-strictly-public
# https://developers.cloudflare.com/workers/observability/errors/
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# The Workers binding addresses one namespace. Methods take a repo name, not a
# namespace, so each team is a prefix on the repo name. stylebook-review and
# stylebook-demo stay in the account and are not bound.
# https://developers.cloudflare.com/artifacts/api/workers-binding/
# https://developers.cloudflare.com/artifacts/concepts/namespaces/
[[artifacts]]
binding = "WORKSPACE"
namespace = "stylebook"
remote = true # local dev talks to the real Artifacts service

# Sign-in email from one sender.
# https://developers.cloudflare.com/email-service/configuration/send-bindings/
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = [ "sign-in@stylebook.dev" ]

# Starting limits. https://developers.cloudflare.com/artifacts/platform/pricing/
[vars]
MAX_WORKSPACES = "40"
MAX_WORKSPACES_PER_EMAIL = "2"
MAX_WORKSPACES_PER_IP_PER_DAY = "5"
MAX_PEOPLE = "25"
MAX_AGENTS = "40"
MAX_OPEN_SUGGESTIONS = "200"
MAX_SIGN_IN_EMAILS_PER_HOUR = "5"
MAX_SIGN_IN_EMAILS_PER_IP_PER_HOUR = "20"
MAX_SIGN_IN_EMAILS_GLOBAL_PER_HOUR = "100"
# Email links stay in the code. Access is the sign-in that runs.
SIGN_IN = "access"
# A download or a restore larger than this is refused with a plain message.
MAX_BACKUP_BYTES = "20000000"
MAX_BACKUP_UPLOAD_BYTES = "20000000"

# Demo address. Remove this block when the domain is not in your account.
# https://developers.cloudflare.com/workers/configuration/routing/custom-domains/
[[routes]]
pattern = "stylebook.dev"
custom_domain = true

# Arrival rows. The database id is the D1 database, not an account id.
[[d1_databases]]
binding = "DB"
database_name = "stylebook"
database_id = "49be122c-bc15-4085-a8f4-9edb30f0409b"
migrations_dir = "migrations"

# One instance per suggestion session. Created together by the demo route.
[[workflows]]
name = "stylebook-suggestion"
binding = "SUGGESTIONS"
class_name = "SuggestionWorkflow"

# Records each push. Started by the trigger below, not by the demo route.
[[workflows]]
name = "stylebook-arrival"
binding = "ARRIVALS"
class_name = "ArrivalWorkflow"

# Namespace-wide: every push in the workspace, including copies created after
# this deploy. Wrangler 4.147's config schema requires `targets` with
# `workflow_name`, and `filter.repo_name` when a filter is limited to one repo.
# The public guide shows `target.scriptName` / `target.workflowName` and
# `filter.repoName`. Leaving repo_name unset is what covers the whole namespace.
# https://developers.cloudflare.com/artifacts/guides/build-and-deploy-on-push/
[[triggers.events]]
type = "cf.artifacts.repo.pushed"

  [triggers.events.filter]
  namespace = "stylebook"

  [[triggers.events.targets]]
  type = "workflow"
  workflow_name = "stylebook-arrival"

# Polling 100 session instances needs more subrequests than the default.
# Seeding several copies in one request needs more CPU than the default 30s.
# https://developers.cloudflare.com/workers/platform/limits/#cpu-time
# https://developers.cloudflare.com/workers/platform/limits/#subrequests
[limits]
subrequests = 10000
cpu_ms = 300000

[observability]
enabled = true

  [observability.logs]
  enabled = true

  [observability.traces]
  enabled = true
